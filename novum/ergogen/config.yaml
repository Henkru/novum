meta:
  engine: 4.1.0
  version: 2.0.0
  author: Henri Nurmi
units:
  kx: u
  ky: u
  px: kx + 2
  py: ky + 2
  mirror_distance: 10U
  index_stagger: -2.5
  arch_top_x: 0
  arch_top_y: -132.5
  arch_bottom_x: -70
  arch_bottom_y: -323
  arch_left_x: 230.5
  arch_left_y: 16
  arch_right_x: -224
  arch_right_y: 20
  mcu_shift_x: kx + 2
  mcu_shift_y: -13.5
  conn_cut_width: 22
  conn_cut_shift_y: 9.6
  mounting_spacer_diameter: 3.1
  mounting_hole_diameter: 2.2
  trrs_shift_x: kx + 17
  trrs_shift_y: mcu_shift_y - 22.5
  reset_shift_x: kx + 13
  reset_shfit_y: trrs_shift_y - 6.5
  tenting_puck_shift_y: -ky/2 - 5.6
  logo_shift_y: -16.25
  zone_width: 10kx
  zone_height: 8ky
points:
  zones:
    matrix:
      key.tags: switch
      columns:
        outer:
          key.column_net: COL0
        pinky:
          key.column_net: COL1
        ring:
          key.stagger: 9
          key.column_net: COL2
        middle:
          key.stagger: 2.5
          key.column_net: COL3
        index:
          key.stagger: index_stagger
          key.column_net: COL4
        inner:
          key.stagger: -3.5
          key.column_net: COL5
      rows:
        bottom:
          row_net: ROW3
        home:
          row_net: ROW2
        top:
          row_net: ROW1
        num:
          row_net: ROW0
      # Fix placement on KiCAD sheet.
      anchor:
        shift: [50, -100]
    thumbs:
      key.tags: switch
      anchor:
        ref: matrix_index_bottom
        shift: [0, -ky]
      columns:
        mod1:
          key.column_net: COL0
          rows:
            cluster:
              row_net: ROW4
        mod2:
          key:
            shift: [1.1, -5]
            rotate: -10
          key.column_net: COL1
          rows:
            cluster:
              row_net: ROW4
        layer:
          rows:
            layer:
              shift: [2.3, -11]
              rotate: 67
              padding: 0
              column_net: COL2
              row_net: ROW4
              name: thumbs_layer_cluster
            mod3:
              shift: [-kx, 0]
              column_net: COL3
              row_net: ROW4
              name: thumbs_mod3_cluster
        space:
          key:
            width: 1.5kx
            rotate: 64
            shift: [-1.6, -26]
          key.column_net: COL4
          rows:
            cluster:
              row_net: ROW4
    encoder:
      key.tags: encoder
      anchor:
        ref: matrix_inner_bottom
        shift: [1.22kx, 0]
      columns:
        col:
          key.column_net: COL5
      rows:
        row:
          row_net: ROW4
    mounting_left:
      key:
        tags: mount
        padding: 2ky
      anchor:
        ref: matrix_outer_bottom
        shift: [kx/2, ky/2]
      columns:
        c1:
      rows:
        r1:
        r2:
    mounting_right:
      key:
        tags: mount
        padding: 3ky + 1
      anchor:
        ref: matrix_inner_bottom
        shift: [-kx/2 + 1, -ky/2 - 1]
      columns:
        c1:
      rows:
        r1:
        r2:
    mounting_thumb:
      key:
        tags: mount
      anchor:
        ref: thumbs_space_cluster
        shift: [kx/2 + 2, ky/2 - 2]
      columns:
        c1:
      rows:
        r1:
    mounting_space_left_bottom:
      key:
        tags: mount
      anchor:
        ref: thumbs_space_cluster
        shift: [-0.75kx + 4, -0.5ky + 16]
      columns:
        c1:
      rows:
        r1:
  mirror:
    ref: matrix_middle_bottom
    distance: mirror_distance
outlines:
  _keys_normal:
    - what: rectangle
      where: [switch, encoder]
      size: [kx-1, ky-1]
  _keys_space:
    - what: rectangle
      where:
        ref: thumbs_space_cluster
      size: [1.5kx-1, ky-1]
  keys:
    - name: _keys_normal
    - operation: stack
      name: _keys_space
  # Outline arches for left side
  _top_arch_circle_left:
    - what: circle
      radius: 200
      where:
        ref: matrix_middle_bottom
        shift: [arch_top_x, arch_top_y]
  _bottom_arch_circle_left:
    - what: circle
      radius: 300
      where:
        ref: matrix_middle_bottom
        shift: [arch_bottom_x, arch_bottom_y]
  _left_arch_circle_left:
    - what: circle
      radius: 300
      where:
        ref: matrix_middle_bottom
        shift: [arch_left_x, arch_left_y]
  _right_arch_circle_left:
    - what: circle
      radius: 300
      where:
        ref: matrix_middle_bottom
        shift: [arch_right_x, arch_right_y]
  _conn_cut_left:
    - what: rectangle
      size: [conn_cut_width, 10]
      where:
        ref: matrix_inner_num
        shift: [kx + 2, conn_cut_shift_y]
  _arches_left:
    [
      +_top_arch_circle_left,
      -_bottom_arch_circle_left,
      ~_left_arch_circle_left,
      ~_right_arch_circle_left,
    ]
  # Outline arches for right side
  _top_arch_circle_right:
    - what: circle
      radius: 200
      where:
        ref: matrix_middle_bottom
        shift: [mirror_distance - arch_top_x, arch_top_y]
  _bottom_arch_circle_right:
    - what: circle
      radius: 300
      where:
        ref: matrix_middle_bottom
        shift: [mirror_distance - arch_bottom_x, arch_bottom_y]
  _left_arch_circle_right:
    - what: circle
      radius: 300
      where:
        ref: matrix_middle_bottom
        shift: [mirror_distance - arch_left_x, arch_left_y]
  _right_arch_circle_right:
    - what: circle
      radius: 300
      where:
        ref: matrix_middle_bottom
        shift: [mirror_distance - arch_right_x, arch_right_y]
  _conn_cut_right:
    - what: rectangle
      size: [conn_cut_width, 10]
      where:
        ref: mirror_matrix_inner_num
        shift: [kx + 2, conn_cut_shift_y]
  _arches_right:
    [
      +_top_arch_circle_right,
      -_bottom_arch_circle_right,
      ~_left_arch_circle_right,
      ~_right_arch_circle_right,
    ]
