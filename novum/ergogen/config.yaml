    - what: circle
      radius: mounting_hole_diameter/2
      where: mount
  # Tenting Puck
  _tenting_puck:
    - what: circle
      radius: 41.5/2
      where:
        ref: matrix_middle_home
        shift: [kx/2, tenting_puck_shift_y]
  # Board outlines
  board_outline_left:
    - what: outline
      name: _fusion_outline_left
  board_outline_right:
    - what: outline
      name: _fusion_outline_right
  board_left: [board_outline_left, -_mounting_holes]
  board_right: [board_outline_right, -_mounting_holes]
  board_pcb_left: [board_outline_left, -_conn_cut_left]
  board_pcb_right: [board_outline_right, -_conn_cut_right]
  board_tenting_puck_left: [board_outline_left, -_tenting_puck]
  # Switch plate
  _switch_cutouts:
    - what: rectangle
      where: [switch, encoder]
      asym: source
      size: 14
      bound: false
  _mcu_cutout:
    - what: rectangle
      size: [30, 60]
      where:
        ref: matrix_inner_home
        shift: [0.5kx + 30/2 + 0.5, -0.5ky + 60/2 + 0.5]
  switch_plate: [board_outline_left, -_switch_cutouts, -_mcu_cutout]
  switch_plate_without_mcu_cutout: [board_outline_left, -_switch_cutouts]
  switch_plate_with_mouting: [switch_plate, -_mounting_holes]
  switch_plate_without_mcu_cutout_with_mouting:
    [switch_plate_without_mcu_cutout, -_mounting_holes]
  # Debug outlines
  _debug:
    - name: board_left
    - operation: stack
      name: keys
  debug:
    - name: _mounting_holes
    - operation: stack
      name: _debug
pcbs:
  left:
    template: kicad8
    outlines:
      main:
        outline: board_pcb_left
    footprints:
      switch:
        what: mx
        where: [[-/^mirror_.*/, switch]]
        adjust:
          rotate: 180
        params:
          from: "{{colrow}}"
          to: "{{column_net}}"
          hotswap: true
          keycaps: true
      diode:
        what: diode
        where: [[-/^mirror_.*/, [switch, encoder]]]
        asym: source
        adjust:
          shift: [0, 4.5]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
      encoder:
        what: rotary
        params:
          from: col_row
          to: COL5
          A: ENC1_A
          B: ENC1_B
          C: GND
        where:
          ref: encoder_col_row
          rotate: -90
      promicro:
        what: promicro_custom
        where:
          ref: matrix_inner_num
          shift: [mcu_shift_x, mcu_shift_y]
          rotate: -90
        params:
          orientation: down
          P20: VCC # Left side indicator
          P21: ROW0
          P19: ROW1
          P6: ROW2
          P7: ROW3
          P8: ROW4
          P9: COL0
          P18: COL1
          P15: COL2
          P14: COL3
          P16: COL4
          P10: COL5
          P5: ENC1_A
          P4: ENC1_B
          P0: DATA
      trrs:
        what: trrs
        where:
          ref: matrix_inner_num
          shift: [trrs_shift_x, trrs_shift_y]
          rotate: -90
        params:
          A: VCC
          B: DATA
          C: GND
          D: ""
      reset:
        what: reset_button
        where:
          ref: matrix_inner_num
          shift: [reset_shift_x, reset_shfit_y]
          rotate: -90
      zone_front:
        what: zone
        where:
          ref: matrix_outer_num
          shift: [-1kx, 1.2ky]
        params:
          net: VCC
          side: F
          width: zone_width
          height: zone_height
      zone_back:
        what: zone
        where:
          ref: matrix_outer_num
          shift: [-1kx, 1.2ky]
        params:
          net: GND
          side: B
          width: zone_width
          height: zone_height
      mounting:
        what: mounting_hole_plated
        where: [[-/^mirror_.*/, mount]]
        params.drill: mounting_spacer_diameter
      text_left:
        what: text
        where:
          ref: matrix_inner_num
          shift: [mcu_shift_x, mcu_shift_y]
        params:
          text: "Left\\nUp"
      text_version:
        what: version
        where:
          ref: matrix_inner_num
          shift: [mcu_shift_x, mcu_shift_y + 16.5]
      tenting_puck:
        what: tenting_puck
        where:
          ref: matrix_middle_home
