  right:
    template: kicad8
    outlines:
      main:
        outline: board_pcb_right
    footprints:
      switch:
        what: mx
        where: [[/^mirror_.*/, switch]]
        adjust:
          rotate: 180
        params:
          from: "{{colrow}}"
          to: "{{column_net}}"
          hotswap: true
          keycaps: true
      diode:
        what: diode
        where: [[/^mirror_.*/, [switch, encoder]]]
        asym: source
        adjust:
          shift: [0, 4.5]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
      encoder:
        what: rotary
        params:
          from: COL5
          to: mirror_col_row
          A: ENC1_A
          B: ENC1_B
          C: GND
        where:
          ref: mirror_encoder_col_row
          rotate: 90
      promicro:
        what: promicro_custom
        where:
          ref: mirror_matrix_inner_num
          shift: [mcu_shift_x, mcu_shift_y]
          rotate: 90
        params:
          orientation: down
          P20: GND # Right side indicator
          P3: ROW0
          P4: ROW1
          P14: ROW2
          P16: ROW3
          P10: ROW4
          P2: COL0
          P5: COL1
          P6: COL2
          P7: COL3
          P8: COL4
          P9: COL5
          P18: ENC1_A
          P19: ENC1_B
          P0: DATA
      trrs:
        what: trrs
        where:
          ref: mirror_matrix_inner_num
          shift: [trrs_shift_x, trrs_shift_y + 4.6]
          rotate: -90
        params:
          A: VCC
          B: DATA
          C: GND
          D: ""
      reset:
        what: reset_button
        where:
          ref: mirror_matrix_inner_num
          shift: [reset_shift_x, reset_shfit_y]
          rotate: -90
      zone_front:
        what: zone
        where:
          ref: mirror_matrix_outer_num
          shift: [-1kx, 1.2ky]
        params:
          net: VCC
          side: F
          width: -zone_width
          height: zone_height
      zone_back:
        what: zone
        where:
          ref: mirror_matrix_outer_num
          shift: [-1kx, 1.2ky]
        params:
          net: GND
          side: B
          width: -zone_width
          height: zone_height
      mounting:
        what: mounting_hole_plated
        where: [[/^mirror_.*/, mount]]
        params.drill: mounting_spacer_diameter
      text_right:
        what: text
        where:
          ref: mirror_matrix_inner_num
          shift: [mcu_shift_x, mcu_shift_y]
        params:
          text: "Right\\nUp"
      text_version:
        what: version
        where:
          ref: mirror_matrix_inner_num
          shift: [mcu_shift_x, mcu_shift_y + 16.5]
      tenting_puck:
        what: tenting_puck
        where:
          ref: mirror_matrix_middle_home
          shift: [kx/2, tenting_puck_shift_y]
      logo:
        what: logo
        where:
          ref: mirror_matrix_ring_bottom
          shift: [19, logo_shift_y]
